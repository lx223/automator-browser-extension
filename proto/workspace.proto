syntax = "proto3";

package proto;

message Tab {
  int32 id = 1;
  int32 window_id = 2;
  optional int32 group_id = 3;
  int32 index = 4;
  optional string url = 5;
  optional string title = 6;
  optional string fav_icon_url = 7;
  bool pinned = 8;
  bool active = 9;
  bool muted = 10;
  optional string pending_url = 11;
  bool highlighted = 12;
  bool incognito = 13;
  optional bool audible = 14;
  optional bool discarded = 15;
  optional bool auto_discardable = 16;
  optional string status = 17;
  optional int32 opener_tab_id = 18;
  optional int32 width = 19;
  optional int32 height = 20;
  MutedInfo muted_info = 21;
  optional string session_id = 22;
}

message MutedInfo {
  bool muted = 1;
  optional string reason = 2;
  optional string extension_id = 3;
}

message Group {
  enum GroupColor {
    GROUP_COLOR_UNSPECIFIED = 0;
    GROUP_COLOR_GREY = 1;
    GROUP_COLOR_BLUE = 2;
    GROUP_COLOR_RED = 3;
    GROUP_COLOR_YELLOW = 4;
    GROUP_COLOR_GREEN = 5;
    GROUP_COLOR_PINK = 6;
    GROUP_COLOR_PURPLE = 7;
    GROUP_COLOR_CYAN = 8;
    GROUP_COLOR_ORANGE = 9;
  }

  int32 id = 1;
  int32 window_id = 2;
  optional string title = 3;
  GroupColor color = 4;
  bool collapsed = 5;
}

message Window {
  int32 id = 1;
  bool focused = 2;
  bool incognito = 3;
  bool always_on_top = 4;
  optional int32 top = 5;
  optional int32 left = 6;
  optional int32 width = 7;
  optional int32 height = 8;
  optional string type = 9;
  optional string state = 10;
  repeated Tab tabs = 11;
  optional string session_id = 12;
}

message Workspace {
  repeated Tab tabs = 1;
  repeated Group groups = 2;
  repeated Window windows = 3;
}
